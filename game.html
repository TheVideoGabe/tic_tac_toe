<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tic Tac Toe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<header>
    <div class="container-fluid pulsing-neon centered-content justify-content-center py-3">
    <header class="d-flex justify-content-center py-3">
        <div class="container-fluid centered-content">
            <div class="container text-center" id="title-container">
                <span class="lead" id="scramble-text-1"></span>
                <span class="lead" id="scramble-text-1"></span>
                <span class="lead" id="scramble-text-1"></span>
                <span class="lead" id="scramble-text-2"></span>
                <span class="lead" id="scramble-text-2"></span>
                <span class="lead" id="scramble-text-2"></span>
                <h1 class="" id="game-title"><strong>Let's Play A Game!</strong></h1>
                <span class="lead" id="scramble-text-3"></span>
                <span class="lead" id="scramble-text-3"></span>
                <span class="lead" id="scramble-text-3"></span>
                <span class="lead" id="scramble-text-4"></span>
                <span class="lead" id="scramble-text-4"></span>
                <span class="lead" id="scramble-text-4"></span>

            </div>
        </div>
    </header>
  </div>
</header>
<body>
    <!-- scoreboard -->
    <div class="container-fluid scoreboard justify-content-center align-items-center pt-5">
  <div class="player-score">
    <span id="p1Name">Player 1</span>
    <span id="p1Score">0</span>
  </div>

  <div class="vs">VS</div>

  <div class="player-score">
    <span id="p2Name">Player 2</span>
    <span id="p2Score">0</span>
  </div>
</div>
<!-- gameboard -->
    <div class="container-fluid align-items-center justify-content-center d-flex pt-5" id="game-container">
        <div class="board" id="board">
            <div class="cell" data-index="0"><p class="m-0 interior"></p></div>
            <div class="cell" data-index="1"><p class="m-0 interior"></p></div>
            <div class="cell" data-index="2"><p class="m-0 interior"></p></div>
            <div class="cell" data-index="3"><p class="m-0 interior"></p></div>
            <div class="cell" data-index="4"><p class="m-0 interior"></p></div>
            <div class="cell" data-index="5"><p class="m-0 interior"></p></div>
            <div class="cell" data-index="6"><p class="m-0 interior"></p></div>
            <div class="cell" data-index="7"><p class="m-0 interior"></p></div>
            <div class="cell" data-index="8"><p class="m-0 interior"></p></div>
        </div>
    </div>
    <div class="d-grid gap-2 col-4 mx-auto py-4">
        <button type="button" class="exit-btn btn-lg" id="exitBtn">Exit The Game</button>
    </div>
    

    <div class="modal fade" id="winModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center">

      <div class="modal-header">
        <h5 class="modal-title w-100" id="winText">Winner</h5>
      </div>

      <div class="modal-body">
        <p class="modal-title" id="winMessage">Nice!</p>
      </div>

      <div class="modal-footer justify-content-center">
        <button type="button" class="primary" id="playAgainBtn">
          Play Again
        </button>
      </div>

    </div>
  </div>
</div>
</body>
<footer class="pt-3 border-top">
    <p class="text-center text-muted">Made by VideoGabe ❤️</p>
  </footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrambleTextPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/SplitText.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/TextPlugin.min.js"></script>



<script defer src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
</html>
