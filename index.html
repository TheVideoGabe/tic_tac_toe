<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="landing.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>
    
    <div class="top-xo-ribbon"></div>
    
    <div class="container">
      <div class="xo-anim"></div>
    <h1>TIC TAC TOE</h1>
    <p>Built With HTML, CSS, JavaScript, GSAP, Bootstrap</p>

    <div class="mode-select">
      <!-- Hook these buttons to your game later -->
      <button class="primary" id="playBtn" disabled onclick="startGame()">
        Enter Names to Play
      </button>

      <button class="secondary" onclick="window.open('https://github.com/TheVideoGabe/tic_tac_toe/tree/main', '_blank')">
        GitHub Repo
      </button>
    </div>

    <div class="footer">
      <p class="text-center" id="playerNames">
        Who's Playing?
      </p>
    </div>
    <div class="player-setup">
        <input id="player1" type="text" placeholder="Player 1 Name (X)" />
        <input id="player2" type="text" placeholder="Player 2 Name (O)" />
        <button type="button" class="reset-btn" id="resetBtn">
            Clear Saved Names
        </button>
    </div>    
    <p class="text-center">Made By VideoGabe ❤️</p>
</div>

</body>
<div class="grid-footer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrambleTextPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/SplitText.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/TextPlugin.min.js"></script>



<script defer src="landing.js"></script>
</html>
